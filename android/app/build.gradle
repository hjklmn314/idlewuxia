apply plugin: 'com.android.application'

def releaseSigningEnvironment = [
    storeFile: System.getenv('IDLEWUXIA_RELEASE_KEYSTORE'),
    storePassword: System.getenv('IDLEWUXIA_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('IDLEWUXIA_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('IDLEWUXIA_RELEASE_KEY_PASSWORD')
]
def releaseSigningComplete = releaseSigningEnvironment.values().every { value ->
    value != null && !value.trim().isEmpty()
}
def releasePackagingRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().matches('.*(?:assemble|bundle|package|sign).*release.*')
}

if (releasePackagingRequested && !releaseSigningComplete) {
    throw new GradleException(
        'Release packaging requires external signing environment variables: ' +
        'IDLEWUXIA_RELEASE_KEYSTORE, IDLEWUXIA_RELEASE_STORE_PASSWORD, ' +
        'IDLEWUXIA_RELEASE_KEY_ALIAS and IDLEWUXIA_RELEASE_KEY_PASSWORD.'
    )
}

if (releaseSigningComplete && !file(releaseSigningEnvironment.storeFile).isFile()) {
    throw new GradleException('IDLEWUXIA_RELEASE_KEYSTORE does not point to a readable file.')
}

android {
    namespace "com.idlewuxia.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.idlewuxia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningComplete) {
            release {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-p0-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningComplete) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
