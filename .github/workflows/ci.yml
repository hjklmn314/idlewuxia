name: idlewuxia-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  r0-scope-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate R0 scope and active runtime
        run: npm run task:preflight

      - name: Validate fail-closed release contract and toolchain
        run: npm run release:preflight

      - name: Build, sync, and verify three-layer web freshness
        run: npm run android:sync

      - name: Reject untracked or unapproved Android product resources
        run: npm run android:resources:validate

      - name: Bootstrap Gradle wrapper with bounded network retry
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Gradle wrapper bootstrap failed after ${attempt} attempts." >&2
              exit 1
            fi

            delay=$((attempt * 10))
            echo "Gradle wrapper bootstrap attempt ${attempt} failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done

      - name: Assemble clean-checkout Android debug artifact
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Audit merged Android permissions and exported components
        run: npm run security:audit:android-merged
